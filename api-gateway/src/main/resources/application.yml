server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "http://localhost:3000" # Your React Frontend URL
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # User & Admin Service Route
        - id: user_admin_service_route
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**, /api/admin/**, /api/users/**

        # Tourist Service Route
        - id: tourist_service_route
          uri: http://localhost:8081
          predicates:
            - Path=/api/tourists/**

        # Vendor Service Route (Guides & Agencies)
        - id: vendor_service_route
          uri: http://localhost:8083
          predicates:
            - Path=/api/vendors/**

        # Booking Service Route
        - id: booking_service_route
          uri: http://localhost:8084
          predicates:
            - Path=/api/bookings/**
